name: Publish Camunda fork to GitHub Packages

on:
  push:
    branches:
      - codex/camunda7-sb4-fork
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-camunda-fork:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21 for GitHub Packages publishing
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Show publish version
        shell: bash
        run: |
          set -euo pipefail
          version="$(mvn -q -N help:evaluate -Dexpression=project.version -DforceStdout)"
          echo "Publishing version: ${version}"
          if [[ "${version}" != *"-tiny-sb4-"* ]]; then
            echo "Refusing to publish a non tiny-sb4 fork version: ${version}"
            exit 1
          fi

      - name: Preinstall spin/core test-jar for fixed-version publish
        shell: bash
        run: |
          set -euo pipefail
          mvn -B \
            -pl spin/core \
            -am \
            -DskipTests \
            -DskipITs \
            install

      - name: Deploy minimal fork artifact set
        shell: bash
        run: |
          set -euo pipefail
          mvn -B \
            -pl bom/camunda-bom,bom/camunda-only-bom,spin/bom,commons/bom,connect/bom,spin/dataformat-all,spring-boot-starter/starter,spring-boot-starter/starter-rest \
            -am \
            -Dmaven.test.skip=true \
            -DskipTests \
            -DskipITs \
            deploy
